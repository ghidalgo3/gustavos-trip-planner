targetOrigin: http://localhost:5173

personas:
  - id: new-trip-planner
    version: "1"
    name: First-time trip planner
    familiarity: First visit to Trip Planner, comfortable with common web controls
    description: Planning shared travel and checking details from both a laptop and a phone.

scenarios:
  - id: find-destination-dates
    version: "2"
    goal: Find the arrival and departure dates for a destination in a saved trip.
    persona: new-trip-planner
    setup: Start signed in on the Trips page of the local Docker app. Pick a trip and a dated destination from the local data before measuring the path. Use the same trip and destination for reruns.
    startPath: /
    success: The trip overview shows both dates next to the selected destination.
    partial: The trip is open and the destination is visible, but the stay dates cannot be confirmed.
    components: [trip-list, trip-overview, search]
    platforms: [desktop, mobile-web]
    actionBudget:
      desktop: 2
      mobile-web: 2

  - id: trip-lifecycle
    version: "1"
    goal: Create a trip, rename it, and delete it.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique name for a trip created during this attempt.
    startPath: /
    success: The trip was created, saved under its new name, and removed.
    writes: true
    components: [trip-list, trip-overview, search]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: edit-trip
        goal: Rename the trip you just created.
        success: The same saved trip shows the new name after you close the editor.
      - id: delete-trip
        goal: Delete the trip you just renamed.
        success: The Trips page no longer lists the renamed trip when you look for it.

  - id: add-destination-to-new-trip
    version: "1"
    goal: Create a trip and add a destination.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique trip name and a destination to add.
    startPath: /
    success: The selected destination is saved on the newly created trip.
    writes: true
    components: [trip-list, trip-overview, place-search]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: add-destination
        goal: Add the selected destination to the trip you just created.
        success: The trip overview shows the saved destination after the editor closes.

  - id: add-activity-to-new-trip
    version: "1"
    goal: Create a trip and save an activity at one of its destinations.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique trip name, a destination, and a named activity.
    startPath: /
    success: The activity appears under its destination on the newly created trip.
    writes: true
    components: [trip-list, trip-overview, place-search, activities]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: add-destination
        goal: Add the selected destination to the trip you just created.
        success: The trip overview shows the saved destination.
      - id: add-activity
        goal: Save the named activity at the destination you just added.
        success: The destination's activity list shows the saved activity under its chosen name.

  - id: plan-multi-city-trip-without-flights
    version: "2"
    goal: Plan a four-city trip using only ground transportation. Build the daily schedule, revise one event, and check that the plan survives a reload.
    persona: new-trip-planner
    setup: >-
      Start signed in on Trips using a disposable local database. Give each attempt a unique trip name.
      Plan Amsterdam June 10–12, Brussels June 12–14, Paris June 14–16, and Versailles June 16–18, 2027.
      Plan a train to Brussels on June 12 from 09:00 to 11:00 local time, a car to Paris, and a walk to Versailles.
      In Amsterdam add Canal walk, Museum visit, and Jordaan photos. In Brussels add Grand Place walk and Comic Art Museum.
      In Paris add Seine walk, Orsay visit, and Luxembourg Gardens. In Versailles add Palace visit and Gardens walk.
      Leave Jordaan photos unscheduled. Schedule the other Amsterdam activities on June 11 at 09:00–10:00 and 10:30–12:00.
      Schedule the Brussels activities on arrival day at 12:00–13:00 and 14:00–15:00, after the train.
      Schedule the Paris activities on June 15 at 09:00–10:00, 10:30–12:30, and 14:00–15:00, then move Luxembourg Gardens to June 16 at the same time.
      Schedule the Versailles activities on June 17 at 09:00–11:00 and 11:30–12:30.
    startPath: /
    success: After reload, the trip shows four dated visits and three ground legs. Each schedule shows its saved events, Luxembourg Gardens appears on the new day, and Jordaan photos is still unscheduled.
    partial: The trip exists, but one or more visits, ground legs, map checks, or schedule changes could not be confirmed.
    writes: true
    components: [trip-list, trip-overview, place-search, transportation, activities, schedule, map]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip.
        success: The trip overview or Trips page shows the unique name.
      - id: add-destinations
        goal: Save all four dated visits in travel order.
        success: Amsterdam, Brussels, Paris, and Versailles appear in order with their planned dates.
      - id: plan-transportation
        goal: Save the train, car, and walking legs without choosing a flight.
        success: The overview shows Train to Brussels, Car to Paris, and Walking to Versailles. The train card shows the departure and arrival times.
      - id: create-activities
        goal: Add the ten activities to their matching destinations by name.
        success: Each named activity appears in the Ideas list for its destination.
      - id: switch-activity-views
        goal: Switch from Ideas to Schedule and back within one destination while checking the map.
        success: The map stays visible for the same destination in both views. On a phone, it stays above the content below the Ideas and Schedule tabs.
      - id: schedule-activities
        goal: Schedule nine activities across the four visits and leave Jordaan photos unscheduled.
        success: The calendar shows each activity at the chosen time, with the train and both Brussels activities on arrival day. Jordaan photos appears in Unscheduled.
      - id: revise-schedule
        goal: Move Luxembourg Gardens to June 16, then reload and verify the trip.
        success: The revised activity appears once on June 16 at 14:00. After reload, the other activities retain their dates and times and all three ground legs appear on Overview.

  - id: finish-seeded-trip-plan
    version: "2"
    goal: Finish planning a seeded Amsterdam and London trip, then see what needs attention after a date change.
    persona: new-trip-planner
    setup: >-
      Start signed in as the owner on Trips in the local Docker app. Seed a new disposable trip
      with scripts/seed_database --planning-audit TRIP_NAME. Tell the traveler the seeded trip name.
      They want to visit the market on Amsterdam's first day from 14:00 to 15:00, keep
      Amsterdam's last day and their London day open, and have already arranged their
      Amsterdam-to-London train outside the app. Use a fresh seed for each attempt.
    startPath: /
    success: The trip shows Planned after the last travel leg is accounted for. Changing Amsterdam's dates reopens its days while London stays planned.
    partial: Some planning decisions are saved, but the traveler cannot confirm trip completion or tell what reopened.
    writes: true
    components: [trip-list, trip-overview, activities, schedule, transportation]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: find-next-step
        goal: Open the seeded trip and work out what needs to happen next.
        success: Overview identifies the unscheduled Amsterdam activity as the next action.
      - id: schedule-market
        goal: Schedule the market for 14:00 to 15:00 on the first day in Amsterdam.
        success: The Amsterdam calendar shows the market at the intended time.
      - id: review-amsterdam
        goal: Use Day details to confirm each scheduled Amsterdam day and keep the remaining day open.
        success: Each scheduled day shows Day planned in Day details, and the last day shows Open by choice.
      - id: review-london
        goal: Leave London open and return to the trip plan.
        success: Both visits are planned and the remaining trip action points to intercity travel.
      - id: arrange-train
        goal: Record that Amsterdam-to-London travel is already arranged and check the trip after reload.
        success: The leg reads Arranged separately and the trip still shows Planned after reload.
      - id: reopen-amsterdam
        goal: Move Amsterdam's departure one day earlier and check which parts need attention.
        success: Amsterdam's updated dates require schedule work, and London stays planned. Stale times refresh automatically when Schedule opens.

# Browser profiles are defined by the skill and can be overridden here.
# Use a rule ID and false to disable it, or supply the fields to override.
rules: {}
