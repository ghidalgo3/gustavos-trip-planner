targetOrigin: http://localhost:5173

personas:
  - id: new-trip-planner
    version: "1"
    name: First-time trip planner
    familiarity: First visit to Trip Planner, comfortable with common web controls
    description: Planning shared travel and checking details from both a laptop and a phone.

scenarios:
  - id: find-destination-dates
    version: "2"
    goal: Find the arrival and departure dates for a destination in a saved trip.
    persona: new-trip-planner
    setup: Start signed in on the Trips page of the local Docker app. Pick a trip and a dated destination from the local data before measuring the path. Use the same trip and destination for reruns.
    startPath: /
    success: The trip overview shows both dates next to the selected destination.
    partial: The trip is open and the destination is visible, but the stay dates cannot be confirmed.
    components: [trip-list, trip-overview, search]
    platforms: [desktop, mobile-web]
    actionBudget:
      desktop: 2
      mobile-web: 2

  - id: trip-lifecycle
    version: "1"
    goal: Create a trip, rename it, and delete it.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique name for a trip created during this attempt.
    startPath: /
    success: The trip was created, saved under its new name, and removed.
    writes: true
    components: [trip-list, trip-overview, search]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: edit-trip
        goal: Rename the trip you just created.
        success: The same saved trip shows the new name after you close the editor.
      - id: delete-trip
        goal: Delete the trip you just renamed.
        success: The Trips page no longer lists the renamed trip when you look for it.

  - id: add-destination-to-new-trip
    version: "1"
    goal: Create a trip and add a destination.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique trip name and a destination to add.
    startPath: /
    success: The selected destination is saved on the newly created trip.
    writes: true
    components: [trip-list, trip-overview, place-search]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: add-destination
        goal: Add the selected destination to the trip you just created.
        success: The trip overview shows the saved destination after the editor closes.

  - id: add-activity-to-new-trip
    version: "1"
    goal: Create a trip and save an activity at one of its destinations.
    persona: new-trip-planner
    setup: Start signed in on Trips in a disposable local database. Choose a unique trip name, a destination, and a named activity.
    startPath: /
    success: The activity appears under its destination on the newly created trip.
    writes: true
    components: [trip-list, trip-overview, place-search, activities]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create a new trip with the chosen name.
        success: The saved trip appears on the Trips page or in its overview.
      - id: add-destination
        goal: Add the selected destination to the trip you just created.
        success: The trip overview shows the saved destination.
      - id: add-activity
        goal: Save the named activity at the destination you just added.
        success: The destination's activity list shows the saved activity under its chosen name.

  - id: plan-multi-city-trip-without-flights
    version: "1"
    goal: Create a multi-city trip, plan different ground transportation between the cities, and schedule an activity at every destination.
    persona: new-trip-planner
    setup: Start signed in on Trips using a disposable local database. Give each attempt a unique trip name. Plan Amsterdam June 10–12, Brussels June 12–14, and Paris June 14–16, 2027. Use a train from Amsterdam to Brussels and a car from Brussels to Paris. Add Canal walk, Grand Place walk, and Seine walk to the matching cities.
    startPath: /
    success: The new trip shows all three dated visits, the two saved ground transportation legs, and a scheduled activity within each visit.
    partial: The trip exists, but one or more dated visits, transportation legs, or scheduled activities could not be confirmed.
    writes: true
    components: [trip-list, trip-overview, place-search, transportation, activities, schedule]
    platforms: [desktop, mobile-web]
    checkpoints:
      - id: create-trip
        goal: Create the new trip.
        success: The trip overview or Trips page shows the unique name.
      - id: add-destinations
        goal: Save all three dated visits in travel order.
        success: Amsterdam, Brussels, and Paris appear in order with their planned dates.
      - id: plan-transportation
        goal: Save the train and car legs between consecutive cities without choosing a flight.
        success: The Amsterdam-to-Brussels card shows Train and the Brussels-to-Paris card shows Car.
      - id: create-activities
        goal: Add each named activity to its matching destination using the activity name only.
        success: Each named activity appears in the Ideas list for its destination.
      - id: schedule-activities
        goal: Schedule the three activities during their respective visits.
        success: The calendar shows each activity on a date in its destination's visit after returning to the schedule.

# Browser profiles are defined by the skill and can be overridden here.
# Use a rule ID and false to disable it, or supply the fields to override.
rules: {}
