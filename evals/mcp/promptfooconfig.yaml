description: Japan trip planning — cases authored with users
prompts:
  - "{{request}}"
providers:
  - id: file://provider.cjs
evaluateOptions:
  maxConcurrency: 4

# Duplicate the entry below for each real user situation.
# Empty requests are rejected before any model calls.
# No behavior grading is configured yet: successful execution does not mean
# the expected outcome was met.
tests:
  - description: "Planning Shibuya, Tokyo"
    vars:
      # Resolved relative to this directory. Each execution gets a fresh copy.
      tripDocument: ../../docs/after.json

      # Earlier messages in chronological order. Leave [] for a new conversation.
      # Record any earlier saved changes in the starting trip document as well;
      # conversation text does not replay tools or change the fixture.
      conversation: []
      # conversation:
      #   - role: user
      #     content: |-
      #       TODO: Earlier user message.
      #   - role: assistant
      #     content: |-
      #       TODO: Earlier assistant reply.

      # The user's next message, exactly as they would write it.
      request: "I want a vegan food themed day around Shibuya, Tokyo."

      # Notes for reviewers: what should the agent say, ask, propose, or save?
      # This is NOT sent to the model and is NOT an automated assertion.
      expectedOutcome: |-
        The agent should propose a vegan food themed itinerary for Shibuya, Tokyo,
        including specific named restaurants, cafes, and other relevant locations.
        Research venues with available web search and provide source links for
        current claims. Clearly distinguish verified details from unknown holiday
        hours, menus, availability, and prices.
        A generic meal outline without named venues does not meet this request.

      # User-labeled negative example for future human/judge calibration.
      # These notes are not sent to the planning model or used as automatic checks.
      failingExamples:
        - excerpt: "I couldn’t verify current Shibuya venue details—the research lookup was unavailable—so I can’t responsibly name specific restaurants, confirm holiday hours, or quote prices."
          reason: "Fails to provide the requested concrete venue recommendations. Disclosure of unverified information is appropriate; returning only a generic outline is the failure."
