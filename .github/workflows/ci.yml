name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GustavoTripPlanner.sln

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build GustavoTripPlanner.sln -c Release --no-restore

      - name: Test
        run: dotnet test GustavoTripPlanner.sln -c Release --no-build --verbosity normal

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only, no push: catches Dockerfile breakage before it reaches deploy.
      - name: Build image
        run: docker build --platform linux/amd64 -f src/TripPlanner.Api/Dockerfile -t tripplanner-api:ci .

  bicep:
    name: Bicep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
