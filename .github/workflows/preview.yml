name: Deploy PR test environment

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open PR number to deploy. Leave blank to refresh the active test environment.
        type: string
      tested_run:
        description: Optional test environment run ID to reuse a tested image for the same PR and application source.
        type: string
      announce_only:
        description: Post the sign-in link for the specified PR already running in the test environment.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    if: >-
      github.ref == 'refs/heads/main' && vars.AZURE_PREVIEW_CLIENT_ID != ''
      && (github.event_name != 'pull_request_target'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
      id-token: write
    outputs:
      pr: ${{ steps.select.outputs.pr }}
      sha: ${{ steps.select.outputs.sha }}
      merge_sha: ${{ steps.select.outputs.merge_sha }}
      tested_run: ${{ steps.select.outputs.tested_run }}
      action: ${{ steps.select.outputs.action }}
      backend: ${{ steps.web.outputs.backend }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_RUN: ${{ inputs.tested_run }}
          ANNOUNCE_ONLY: ${{ inputs.announce_only }}
        run: |
          if [[ "$ANNOUNCE_ONLY" == true ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ && -z "$TESTED_RUN" ]] ||
              { echo 'Specify the open PR to announce without a tested run ID.'; exit 1; }
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            [[ -z "$TESTED_RUN" ]] || { echo 'Select a pull request to reuse its image.'; exit 1; }
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.base.ref == "main" and .head.repo.full_name == $repo' <<< "$pr" >/dev/null
          if [[ "$ANNOUNCE_ONLY" == true ]]; then
            current_sha="$(jq -er 'select(.state == "open") | .head.sha' <<< "$pr")"
            printf 'action=announce\nsha=%s\npr=%s\n' "$current_sha" "$PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(jq -r .state <<< "$pr")" == closed ]]; then
            echo 'action=closed' >> "$GITHUB_OUTPUT"
          else
            current_sha="$(jq -er .head.sha <<< "$pr")"
            if [[ -n "$PR_SHA" && "$PR_SHA" != "$current_sha" ]]; then
              echo 'This PR revision is no longer current.'
              exit 1
            fi
            status_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [[ "$(jq -er .base.sha <<< "$pr")" != "$GITHUB_SHA" ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$current_sha" \
                -f state=error -f context='Azure test environment' \
                -f description='Update the PR branch from main before deploying to the test environment' \
                -f target_url="$status_url" >/dev/null
              echo 'GitHub returned an outdated merge snapshot. Update the PR branch from main.'
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
              merge_sha="$(jq -er '.merge_commit_sha | select(type == "string" and test("^[a-f0-9]{40}$"))' <<< "$pr")"
              merge_parents="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha")"
              jq -e --arg base "$GITHUB_SHA" --arg head "$current_sha"                 '.parents[0].sha == $base and .parents[1].sha == $head' <<< "$merge_parents" >/dev/null
              echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
              if [[ -n "$TESTED_RUN" ]]; then
                [[ "$TESTED_RUN" =~ ^[0-9]+$ ]]
                run_path="repos/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN"
                gh api "$run_path" | jq -e --arg repo "$GITHUB_REPOSITORY" '
                  .head_repository.full_name == $repo and .head_branch == "main"
                  and .event == "workflow_dispatch" and .path == ".github/workflows/preview.yml"
                  and .status == "completed"
                ' >/dev/null
                gh api "$run_path/jobs" | jq -e '
                  [.jobs[] | select(.name | startswith("build / "))] |
                  length > 0 and all(.[]; .conclusion == "success")
                ' >/dev/null
                echo "tested_run=$TESTED_RUN" >> "$GITHUB_OUTPUT"
              fi
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$current_sha" \
              -f state=pending -f context='Azure test environment' \
              -f description='Building and deploying to the Azure test environment' \
              -f target_url="$status_url" >/dev/null
            echo "sha=$current_sha" >> "$GITHUB_OUTPUT"
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request_target' && steps.select.outputs.sha != ''
        with:
          persist-credentials: false
      - uses: azure/login@v2
        if: github.event_name == 'pull_request_target' && steps.select.outputs.sha != ''
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check whether the running backend can serve the new web assets
        if: github.event_name == 'pull_request_target' && steps.select.outputs.sha != ''
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          MERGE_SHA: ${{ steps.select.outputs.merge_sha }}
          DEPLOYMENT_CONFIG: ${{ vars.AZURE_PREVIEW_CONFIG }}
        run: zsh scripts/deployment/preview-assets.zsh select

  build:
    needs: select
    if: >-
      needs.select.outputs.sha != ''
      && needs.select.outputs.tested_run == '' && needs.select.outputs.action != 'announce'
    uses: ./.github/workflows/build-image.yml
    with:
      mode: ${{ needs.select.outputs.backend != '' && 'web' || (github.event_name == 'pull_request_target' && 'image' || 'tested-image') }}
      ref: ${{ needs.select.outputs.merge_sha }}
      pr_head: ${{ needs.select.outputs.sha }}

  preview:
    needs: [select, build]
    if: >-
      !cancelled() && needs.select.result == 'success'
      && (needs.select.outputs.sha == ''
          || needs.select.outputs.action == 'announce'
          || needs.select.outputs.tested_run != '' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      deployed: ${{ steps.update.outputs.deployed }}
      login_url: ${{ steps.update.outputs.login_url }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    concurrency:
      group: preview-slot
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.sha != '' && needs.select.outputs.action != 'announce'
        with:
          name: ${{ needs.select.outputs.backend != '' && 'preview-web' || 'deployment-image' }}
          path: ${{ runner.temp }}/release
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.tested_run || github.run_id }}
      - name: Verify the image matches the PR
        if: needs.select.outputs.sha != '' && needs.select.outputs.action != 'announce'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ needs.select.outputs.sha }}
          MERGE_SHA: ${{ needs.select.outputs.merge_sha }}
          TESTED_RUN: ${{ needs.select.outputs.tested_run }}
          RELEASE_STATE_DIR: ${{ runner.temp }}/release
        run: |
          revision="$(cat "$RELEASE_STATE_DIR/revision.sha")"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          ref_path="repos/$GITHUB_REPOSITORY/git"
          previous="$(gh api "$ref_path/commits/$revision")"
          jq -e --arg sha "$PR_HEAD" '.parents[1].sha == $sha' <<< "$previous" >/dev/null
          if [[ -z "$TESTED_RUN" ]]; then
            jq -e --arg base "$GITHUB_SHA" '.parents[0].sha == $base' <<< "$previous" >/dev/null ||
              { echo 'The image was built against an older main. Update the PR branch and rebuild.'; exit 1; }
            exit 0
          fi
          previous_tree="$(jq -er .tree.sha <<< "$previous")"
          current_tree="$(gh api "$ref_path/commits/$MERGE_SHA" --jq .tree.sha)"
          tested_source() {
            gh api "$ref_path/trees/$1?recursive=1" | jq -cer '
              select(.truncated == false) |
              [.tree[] | select(.path == "src" or .path == "docs/schemas" or .path == "tests"
                or .path == "scripts/release-tasks" or .path == ".dockerignore"
                or .path == "GustavoTripPlanner.sln" or .path == ".config/dotnet-tools.json")
                | {path, sha}] | sort_by(.path) | select(length == 7)
            '
          }
          previous_source="$(tested_source "$previous_tree")"
          current_source="$(tested_source "$current_tree")"
          [[ "$previous_source" == "$current_source" ]]
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare the test environment
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          DEPLOYMENT_REVISION: ${{ needs.select.outputs.sha }}
          EVENT_ACTION: ${{ needs.select.outputs.action }}
          RELEASE_STATE_DIR: ${{ runner.temp }}/release
          PREVIEW_BACKEND: ${{ needs.select.outputs.backend }}
          MERGE_SHA: ${{ needs.select.outputs.merge_sha }}
          DEPLOYMENT_CONFIG: ${{ vars.AZURE_PREVIEW_CONFIG }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -n "$PREVIEW_BACKEND" ]]; then
            zsh scripts/deployment/preview-assets.zsh publish
          else
            sudo apt-get install -y zsh
            zsh scripts/deployment/preview.zsh
          fi

  status:
    needs: [select, preview]
    if: always() && needs.select.outputs.sha != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Report test environment status on the PR
        if: needs.select.outputs.action != 'announce' || needs.preview.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ needs.select.outputs.sha }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          PREVIEW_DEPLOYED: ${{ needs.preview.outputs.deployed }}
        run: |
          case "$PREVIEW_RESULT:$PREVIEW_DEPLOYED" in
            success:true) state=success; description='The Azure test environment is ready' ;;
            success:*) state=error; description='This test environment revision was superseded' ;;
            cancelled:*) state=error; description='The test environment run was cancelled' ;;
            *) state=failure; description='The test environment did not deploy' ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_SHA" \
            -f state="$state" -f context='Azure test environment' -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Post the test environment sign-in link
        if: needs.preview.result == 'success' && needs.preview.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select.outputs.pr }}
          PR_SHA: ${{ needs.select.outputs.sha }}
          LOGIN_URL: ${{ needs.preview.outputs.login_url }}
        run: |
          repo_path="repos/$GITHUB_REPOSITORY"
          pr="$(gh api "$repo_path/pulls/$PR_NUMBER")"
          if ! jq -e --arg sha "$PR_SHA" '.state == "open" and .head.sha == $sha' <<< "$pr" >/dev/null; then
            exit 0
          fi

          marker="<!-- tripplanner-azure-preview:$PR_SHA -->"
          comments_path="$repo_path/issues/$PR_NUMBER/comments"
          comment="$(gh api --paginate --slurp "$comments_path?per_page=100" |
            jq -r --arg marker "$marker" '
              first(.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))) // empty
            ')"
          if [[ -n "$comment" ]] && jq -e --arg url "$LOGIN_URL" '.body | contains("](" + $url + ")")' <<< "$comment" >/dev/null; then
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(cat <<EOF
          $marker

          **Test environment is ready.** [Open the test environment and sign in]($LOGIN_URL).

          PR commit \`${PR_SHA:0:7}\` · [Workflow run]($run_url)

          The shared slot serves the most recently deployed PR.
          EOF
          )"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "$repo_path/issues/comments/$(jq -er .id <<< "$comment")" -f body="$body" >/dev/null
          else
            gh api --method POST "$comments_path" -f body="$body" >/dev/null
          fi
